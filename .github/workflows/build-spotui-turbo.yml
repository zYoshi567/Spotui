name: Build Spotui Turbo APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-turbo-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar tu Fork de Spotui
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Inyectar Optimizaciones Turbo en Spotui
        run: |
          python3 - << 'EOF'
          import os, glob, re

          # Registrar TurboInitProvider y Hardware Acceleration en el Manifiesto
          for manifest in glob.glob("**/src/main/AndroidManifest.xml", recursive=True):
              txt = open(manifest, "r", encoding="utf-8").read()
              if "com.spotui.turbo.TurboInitProvider" not in txt and "</application>" in txt:
                  provider_xml = """
                  <provider
                      android:name="com.spotui.turbo.TurboInitProvider"
                      android:authorities="${applicationId}.turboinit"
                      android:exported="false" />
                  </application>"""
                  txt = txt.replace("</application>", provider_xml)
                  if "android:hardwareAccelerated" not in txt:
                      txt = txt.replace("<application", '<application android:hardwareAccelerated="true" android:largeHeap="true"', 1)
                  with open(manifest, "w", encoding="utf-8") as f:
                      f.write(txt)
                  print(f"Manifest optimizado: {manifest}")

          # Conectar ExoPlayer con el buffer rápido de 350ms en los archivos Kotlin
          for kt_file in glob.glob("app/src/**/*.kt", recursive=True):
              if "TurboOptimizer.kt" in kt_file:
                  continue
              txt = open(kt_file, "r", encoding="utf-8").read()
              if "ExoPlayer.Builder(" in txt and "createFastLoadControl" not in txt:
                  pattern = r"(ExoPlayer\.Builder\([^)]+\))"
                  replacement = r"\1.setLoadControl(com.spotui.turbo.TurboOptimizer.createFastLoadControl())"
                  new_txt = re.sub(pattern, replacement, txt)
                  if new_txt != txt:
                      with open(kt_file, "w", encoding="utf-8") as f:
                          f.write(new_txt)
                      print(f"ExoPlayer Turbo inyectado en: {kt_file}")
          EOF

      - name: 4. Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Compilar APK Release Optimizado
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint

      - name: 6. Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-Turbo-APK
          path: |
            app/build/outputs/apk/release/*.apk
            **/build/outputs/apk/release/*.apk
