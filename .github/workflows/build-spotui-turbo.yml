name: Build Spotui Turbo APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-turbo-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar tu Fork de Spotui
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Inyectar Arquitectura Turbo y UI estilo iOS
        run: |
          python3 - << 'EOF'
          import os, glob, re

          gp_path = "gradle.properties"
          gp_content = open(gp_path, "r", encoding="utf-8").read() if os.path.exists(gp_path) else ""
          extra_props = "\norg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\norg.gradle.parallel=true\n"
          if "org.gradle.parallel" not in gp_content:
              with open(gp_path, "a", encoding="utf-8") as f:
                  f.write(extra_props)

          for manifest in glob.glob("**/src/main/AndroidManifest.xml", recursive=True):
              txt = open(manifest, "r", encoding="utf-8").read()
              if "com.spotui.turbo.TurboInitProvider" not in txt and "</application>" in txt:
                  txt = txt.replace("</application>", """
                  <provider android:name="com.spotui.turbo.TurboInitProvider" android:authorities="${applicationId}.turboinit" android:exported="false" />
                  </application>""")
                  txt = txt.replace("<application", '<application android:hardwareAccelerated="true" android:largeHeap="true"', 1)
                  with open(manifest, "w", encoding="utf-8") as f:
                      f.write(txt)

          for kt_file in glob.glob("app/src/**/*.kt", recursive=True):
              if "TurboOptimizer.kt" in kt_file or "TurboAcceptanceTest.kt" in kt_file or "TurboUI.kt" in kt_file:
                  continue
              txt = open(kt_file, "r", encoding="utf-8").read()
              modified = False

              if "ExoPlayer.Builder(" in txt and "configurePlayerBuilder" not in txt:
                  txt = re.sub(r"(ExoPlayer\.Builder\([^)]+\))", r"com.spotui.turbo.TurboOptimizer.configurePlayerBuilder(\1)", txt)
                  modified = True

              if "configurePlayerBuilder" in txt and ".build()" in txt and "attachResilientPlayerGuard" not in txt:
                  txt = txt.replace(".build()", ".build().also { com.spotui.turbo.TurboOptimizer.attachResilientPlayerGuard(it) }")
                  modified = True
                  
              # Inyectar físicas iOS en los botones
              if "import androidx.compose.foundation.clickable" in txt and "TurboUI.iosClickable" not in txt:
                  txt = txt.replace("import androidx.compose.foundation.clickable", "import androidx.compose.foundation.clickable\nimport com.spotui.turbo.TurboUI.iosClickable")
                  txt = re.sub(r"\.clickable\s*\{\s*", ".iosClickable { ", txt)
                  modified = True

              if modified:
                  with open(kt_file, "w", encoding="utf-8") as f:
                      f.write(txt)
          EOF

      - name: 4. Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: 5. Compilar APK Release y APK Debug Optimizados
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug --no-daemon -x lint

      - name: 6. Subir APKs listos para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-Turbo-Final-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
